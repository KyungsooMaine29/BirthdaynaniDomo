<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255,215,0,0.25);
      max-width: 550px;
      z-index: 10;
    }

    h1 {
      color: #d4af37;
      font-size: 3em;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      color: #555;
      line-height: 1.7;
    }

    h3{
      color:#d4af37;
    }

    .emoji {
      font-size: 3rem;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      50% {
        transform: translateY(-10px);
      }
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      animation: fall linear infinite;
      opacity: 0.9;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

<div class="card">
  <div class="emoji">🎉🎂🥳</div>

  <h1>Happy Birthday!</h1>

  <h2>Baby Domo 🎈</h2>

  <p>
    Wishing you all the love and joy, By! ❤️
    <br><br>
    I'm always here for you and so proud of what you have become.
    <br><br>
    This is it, By—let's go on our road to fitness! 💪✨
    <br><br>
    Love you. ❤️
  </p>

  <h3>🎁 Have an amazing birthday! 🎁</h3>
</div>

<script>
const colors = [
  "#FFD700", // Gold
  "#FFC300",
  "#F4C430",
  "#E6BE8A",
  "#D4AF37"
];

for(let i=0;i<120;i++){
  const c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.animationDuration=(3+Math.random()*4)+"s";
  c.style.animationDelay=Math.random()*5+"s";
  c.style.borderRadius=Math.random()>0.5 ? "50%" : "2px";
  document.body.appendChild(c);
}
</script>

</body>
</html>
